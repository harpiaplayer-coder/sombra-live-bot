<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sombra - Avatar de Live</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; background: radial-gradient(circle at 50% 30%, #2a1038, #07030b 70%); color: #fff;
         font-family: system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
  #stage { position: relative; flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; }
  #avatar { width: min(60vh, 90vw); transition: transform .2s; animation: float 4s ease-in-out infinite; }
  #avatar.rose { animation: shake .5s infinite; }
  @keyframes float { 50% { transform: translateY(-14px); } }
  @keyframes shake { 25% { transform: rotate(-4deg) scale(1.05); } 75% { transform: rotate(4deg) scale(1.05); } }
  #subtitle { position: absolute; bottom: 4%; left: 50%; transform: translateX(-50%); width: min(92%, 760px); text-align: center;
              background: rgba(0,0,0,.65); border: 1px solid #6b2d8a; border-radius: 16px; padding: 14px 18px; font-size: 1.3rem;
              opacity: 0; transition: opacity .3s; }
  #subtitle.show { opacity: 1; }
  #subtitle small { display: block; color: #c9a3e0; font-size: .85rem; margin-bottom: 4px; }
  #status { position: absolute; top: 10px; left: 12px; font-size: .8rem; opacity: .7; }
  #start { position: absolute; inset: 0; z-index: 10; background: rgba(0,0,0,.85); display: flex; flex-direction: column;
           align-items: center; justify-content: center; gap: 12px; font-size: 1.1rem; }
  #start button { font-size: 1.3rem; padding: 14px 28px; border: 0; border-radius: 12px; background: #8a2be2; color: #fff; cursor: pointer; }
  #tools { padding: 8px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; background: #0006; width: 100%; }
  #tools input { flex: 1; min-width: 160px; padding: 8px; border-radius: 8px; border: 1px solid #555; background: #111; color: #fff; }
  #tools button { padding: 8px 12px; border-radius: 8px; border: 0; background: #444; color: #fff; cursor: pointer; }
  body.clean #tools, body.clean #status { display: none; }
  .petal { position: absolute; top: -40px; font-size: 2rem; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
</style>
</head>
<body>
<div id="start">
  <div>Clique para ativar a voz do Sombra</div>
  <button id="startBtn">Iniciar</button>
  <small>Dica: adicione ?clean na URL para esconder os botoes de teste na live</small>
</div>

<div id="stage">
  <div id="status">conectando...</div>
  <!-- Personagem ORIGINAL: figura encapuzada com olhos brilhantes e sorriso largo -->
  <svg id="avatar" viewBox="0 0 400 460" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="glow" cx="50%" cy="40%"><stop offset="0" stop-color="#8a2be2" stop-opacity=".45"/><stop offset="1" stop-color="#8a2be2" stop-opacity="0"/></radialGradient>
    </defs>
    <circle cx="200" cy="200" r="190" fill="url(#glow)"/>
    <!-- corpo / manto -->
    <path d="M40 460 C50 330 110 290 200 290 C290 290 350 330 360 460 Z" fill="#14091d" stroke="#3b1a52" stroke-width="4"/>
    <!-- capuz -->
    <path d="M200 20 C100 20 60 110 70 200 C75 260 110 300 200 300 C290 300 325 260 330 200 C340 110 300 20 200 20 Z" fill="#1b0c28" stroke="#4a2166" stroke-width="5"/>
    <!-- interior escuro do capuz -->
    <ellipse cx="200" cy="180" rx="95" ry="110" fill="#05020a"/>
    <!-- olhos -->
    <g id="eyes">
      <ellipse cx="160" cy="150" rx="20" ry="26" fill="#ffe94d"/>
      <ellipse cx="240" cy="150" rx="20" ry="26" fill="#ffe94d"/>
      <circle id="pupilL" cx="160" cy="154" r="8" fill="#111"/>
      <circle id="pupilR" cx="240" cy="154" r="8" fill="#111"/>
    </g>
    <!-- sobrancelhas -->
    <path id="browL" d="M135 118 L185 128" stroke="#ffe94d" stroke-width="6" stroke-linecap="round"/>
    <path id="browR" d="M265 118 L215 128" stroke="#ffe94d" stroke-width="6" stroke-linecap="round"/>
    <!-- boca (anima enquanto fala) -->
    <g id="mouth">
      <path id="mouthShape" d="M150 225 Q200 255 250 225 Q200 240 150 225 Z" fill="#fff" />
    </g>
    <!-- bochechas coradas (aparecem com rosas) -->
    <ellipse id="blushL" cx="130" cy="205" rx="18" ry="10" fill="#ff4d79" opacity="0"/>
    <ellipse id="blushR" cx="270" cy="205" rx="18" ry="10" fill="#ff4d79" opacity="0"/>
  </svg>
  <div id="subtitle"></div>
</div>

<div id="tools">
  <input id="testText" placeholder="Digite um comentario de teste...">
  <button id="sendChat">Enviar comentario</button>
  <button id="sendRose">Mandar Rosa</button>
</div>

<script>
if (location.search.includes('clean')) document.body.classList.add('clean');
const $ = (id) => document.getElementById(id);
const avatar = $('avatar'), subtitle = $('subtitle');
let voices = [], speaking = false, mouthTimer = null;

function loadVoices() { voices = speechSynthesis.getVoices(); }
speechSynthesis.onvoiceschanged = loadVoices; loadVoices();

$('startBtn').onclick = () => { $('start').style.display = 'none'; speechSynthesis.speak(new SpeechSynthesisUtterance(' ')); };

// ---- boca animada ----
const mouth = $('mouthShape');
function setMouth(open) {
  mouth.setAttribute('d', open
    ? 'M150 220 Q200 300 250 220 Q200 235 150 220 Z'
    : 'M150 225 Q200 255 250 225 Q200 240 150 225 Z');
}
function startMouth() { let o = false; clearInterval(mouthTimer); mouthTimer = setInterval(() => { o = !o; setMouth(o); }, 140); }
function stopMouth() { clearInterval(mouthTimer); setMouth(false); }

// ---- expressoes ----
function roseMode(on) {
  avatar.classList.toggle('rose', on);
  $('blushL').setAttribute('opacity', on ? .85 : 0);
  $('blushR').setAttribute('opacity', on ? .85 : 0);
  $('browL').setAttribute('d', on ? 'M135 128 L185 112' : 'M135 118 L185 128');
  $('browR').setAttribute('d', on ? 'M265 128 L215 112' : 'M265 118 L215 128');
}
function rain(emoji, n) {
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div');
    p.className = 'petal'; p.textContent = emoji;
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDuration = 2.5 + Math.random() * 2.5 + 's';
    p.style.animationDelay = Math.random() * 1.2 + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 7000);
  }
}

// ---- fila de falas no navegador ----
const speechQueue = [];
function enqueueSpeech(m) { speechQueue.push(m); if (!speaking) nextSpeech(); }
function nextSpeech() {
  const m = speechQueue.shift();
  if (!m) { speaking = false; return; }
  speaking = true;
  subtitle.innerHTML = `<small>${esc(m.user || '')}${m.input ? ': ' + esc(m.input) : ''}</small>${esc(m.text)}`;
  subtitle.classList.add('show');
  const isRose = m.mood === 'rose';
  if (isRose) { roseMode(true); rain('🌹', 22); }
  else if (m.mood === 'gift') rain('🎁', 10);

  const u = new SpeechSynthesisUtterance(m.text);
  u.lang = 'pt-BR';
  u.voice = voices.find((v) => v.lang === 'pt-BR') || voices.find((v) => v.lang.startsWith('pt')) || null;
  u.pitch = isRose ? 1.7 : 0.6;   // rosa = vozinha derretida e fina; normal = voz grave de terror
  u.rate = isRose ? 1.15 : 0.95;
  u.onstart = startMouth;
  u.onend = u.onerror = () => {
    stopMouth(); roseMode(false);
    setTimeout(() => { subtitle.classList.remove('show'); nextSpeech(); }, 500);
  };
  speechSynthesis.speak(u);
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---- conexao com o servidor ----
function connect() {
  const ws = new WebSocket(`ws://${location.host}`);
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'status') $('status').textContent = m.text;
    if (m.type === 'say') {
      if (m.mood === 'rose' || m.mood === 'gift') speechQueue.unshift(m), !speaking && nextSpeech();
      else enqueueSpeech(m);
    }
  };
  ws.onclose = () => { $('status').textContent = 'reconectando...'; setTimeout(connect, 2000); };
  window.sendWS = (o) => ws.readyState === 1 && ws.send(JSON.stringify(o));
}
connect();

$('sendChat').onclick = () => { const t = $('testText').value.trim(); if (t) sendWS({ type: 'test_chat', text: t }); $('testText').value = ''; };
$('testText').onkeydown = (e) => e.key === 'Enter' && $('sendChat').click();
$('sendRose').onclick = () => sendWS({ type: 'test_rose', count: 1 });
</script>
</body>
</html>
